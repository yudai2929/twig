name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -p 1 ./...
      - name: Build macOS archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "dist/package/bin"
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o dist/package/bin/twig ./cmd/twig
            cp LICENSE dist/package/LICENSE
            tar -czf "dist/twig_${GITHUB_REF_NAME}_macos_${arch}.tar.gz" -C dist/package bin LICENSE
          done
          rm -rf dist/package
          shasum -a 256 dist/*.tar.gz > dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --generate-notes
